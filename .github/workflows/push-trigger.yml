name: Maven Package upon a push

on:
  release:
    types: [published]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      message:
        description: 'Message for manually triggering'
        required: false
        default: 'Triggered for Updates'
        type: string
  push:
    branches:
      - '!release-branch'
      - 'release*'
      - 'injimob*'
      - 'develop'
      - 'master'

jobs:
  build-maven-vc-verifier:
    needs: lint-check
    uses: mosip/kattu/.github/workflows/gradle-build.yml@gpgupdate-master

    with:
      SERVICE_LOCATION: vc-verifier/kotlin/vcverifier
      JAVA_VERSION: 17
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_INJI_TEAM }}
  

  lint-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
        restore-keys: ${{ runner.os }}-gradle-
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'adopt'
        
    - name: Run Lint Check
      run: |
        cd vc-verifier/kotlin/vcverifier
        ./gradlew lint
      
  sonar_analysis:
    needs: build-maven-vc-verifier
    if: "${{  github.event_name != 'pull_request' }}"
    uses: mosip/kattu/.github/workflows/gradlew-sonar-analysis.yml@develop
    with:
      SERVICE_LOCATION: vc-verifier/kotlin/vcverifier
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      ORG_KEY: ${{ secrets.ORG_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_INJI_TEAM }}

